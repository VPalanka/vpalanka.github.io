<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> tiempo ahora</h1>
    <input type="button" id="run" value="RUN">
    <div id="resultado"></div>
     
    <script>
//Le preguntamos qué hora es en madrid y nos contesta con información. Hacemos promesa para que la página siga funcionando mientras se solicita esa información.

        //variables
        let boton=document.getElementById("run")
        let resultado=document.getElementById("resultado")

        //eventos
        boton.addEventListener("click", (e) =>{
          fetch("https://timeapi.io/api/Time/current/zone?timeZone=Europe/Madrid")
            .then((response)=> {
                // resultado.innerHTML="Todo Bien!!!!"
                return response.json()
            })
            .then(data => resultado.innerHTML=data.time)
            .catch(error => resultado.innerHTML="ERROR "+error)
        })

    </script>


</body>
</html>
